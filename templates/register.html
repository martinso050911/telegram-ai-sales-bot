<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — AI Sales Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.15), transparent 40%),
                        radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.1), transparent 40%);
        }
        .auth-card {
            background: rgba(21, 28, 44, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header .logo {
            justify-content: center;
            margin-bottom: 12px;
        }
        .auth-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .auth-form .form-group {
            margin-bottom: 20px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-icon">⚡</span>
                    <span class="logo-text">AI Sales <span class="highlight">Pro</span></span>
                </div>
                <h2>Создать аккаунт</h2>
                <p>Зарегистрируйтесь для взаимодействия с B2B-сервисом</p>
            </div>

            {% if error %}
            <div class="alert-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form action="/register" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Имя пользователя / Логин</label>
                    <input type="text" id="username" name="username" placeholder="Придумайте логин" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Пароль (минимум 4 символа)" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Подтверждение пароля</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-large">Зарегистрироваться 🚀</button>
            </form>

            <div class="auth-footer">
                Уже есть аккаунт? <a href="/login">Войти</a> | <a href="/">На главную</a>
            </div>
        </div>
    </div>
</body>
</html>
